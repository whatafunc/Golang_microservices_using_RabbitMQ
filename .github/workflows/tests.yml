  #       with:
  #         version: ${{ env.GOLANGCI_LINT_VERSION }}
  #         working-directory: ${{ env.BRANCH }}

  tests:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, 'calendar123') }}

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: calendar
        # optional healthcheck ensures DB is ready before tests start
        options: >-
          --health-cmd="pg_isready -U testuser -d calendar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Extract branch name
        run: echo "BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v6.1.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Check out code
        uses: actions/checkout@v6.0.0

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U testuser -d calendar && break
            echo "Waiting for githubs postgres..."
            sleep 3
          done

      - name: Unit tests
        run: go test -v -count=1 -race -timeout=1m ./...
        # working-directory: ${{ env.BRANCH }}

      - name: Run tests
        run: go test -v -count=1 -timeout=1m -tags bench ./...
        if: env.BRANCH == 'hw10_program_optimization'
        working-directory: ${{ env.BRANCH }}

      # - name: Bash tests
